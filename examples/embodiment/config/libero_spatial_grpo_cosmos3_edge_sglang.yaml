defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/cosmos3_edge@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  # Run the driver in the Cosmos native training environment. Actor and env
  # inherit it; rollout and its SGLang server use the serving environment.
  node_groups:
    - label: sglang
      node_ranks: 0
      env_configs:
        - node_ranks: 0
          python_interpreter_path: /path/to/sglang_venv/bin/python
  component_placement:
    actor: 0-3
    env: 4-7
    rollout:
      node_group: sglang
      placement: 4-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: libero_spatial_grpo_cosmos3_edge_sglang
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 25
  resume_dir: null
  # Optional RLinf weights loaded by actor and synchronized to serving.
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  update_epoch: 1
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 5.0
  filter_rewards: true
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 16
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    reward_coef: ${algorithm.reward_coef}
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 512
    group_size: 1
    is_eval: true

rollout:
  group_name: RolloutGroup
  rollout_backend: sglang
  enable_offload: false
  pipeline_stage_num: 1
  model: ${actor.model}
  sglang:
    serving_mode: embodied
    group_name: SGLangServerGroup
    server_type: embodied
    launch_server: true
    launch_router: false
    http_timeout_s: 600
    http_max_retries: 0
    seed: ${rollout.model.seed}
    server:
      model_path: ${rollout.model.model_path}
      backend: sglang
      pipeline_class_name: Cosmos3OmniDiffusersPipeline
      tp_size: 1
      num_gpus: 1
      attention_backend: FA
      dit_cpu_offload: false
      cfg_parallel_degree: 1
      sp_degree: 1
      batching_max_size: 8

actor:
  group_name: ActorGroup
  training_backend: fsdp
  model:
    # Complete Edge LIBERO policy exported with toolkits.cosmos3.convert_checkpoint.
    # The actor and SGLang load this directory, including frozen weights and action heads.
    checkpoint_format: diffusers
    model_path: /path/to/cosmos3-edge-libero/model_diffusers
    wan_vae_path: /path/to/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    action_stats_path: /path/to/libero_native_frame_wise_relative_rot6d.json
    keys_to_skip_loading: []
  micro_batch_size: 1
  global_batch_size: 64
  seed: 42
  enable_offload: false
  optim:
    lr: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.99
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp2
    use_orig_params: true
    gradient_checkpointing: false
    reshard_after_forward: false
    save_full_model_weights: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
      cast_forward_inputs: false

reward:
  use_reward_model: false
critic:
  use_critic_model: false
